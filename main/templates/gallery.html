{% extends "base.html" %}
{% load static %}

{% block title %}Gallery | MadhuramOrganics{% endblock %}

{% block content %}
<style>
    .gallery-filter {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 3rem;
    }

    .filter-btn {
        background: transparent;
        border: 2px solid var(--agro-light-gray);
        color: var(--text-muted);
        padding: 0.5rem 1.5rem;
        border-radius: 50px;
        font-weight: 600;
        transition: var(--transition);
        cursor: pointer;
    }

    .filter-btn:hover,
    .filter-btn.active {
        background: var(--agro-primary);
        border-color: var(--agro-primary);
        color: white;
    }

    .gallery-item {
        margin-bottom: 20px;
        break-inside: avoid;
    }

    .gallery-card {
        border-radius: var(--border-radius-md);
        overflow: hidden;
        position: relative;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        transition: var(--transition);
        background: black;
        /* For nice fade effect */
    }

    .gallery-card img {
        width: 100%;
        display: block;
        transition: transform 0.5s ease;
        opacity: 0.95;
    }

    .gallery-card:hover img {
        transform: scale(1.05);
        opacity: 0.6;
    }

    .gallery-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: var(--transition);
    }

    .gallery-card:hover .gallery-overlay {
        opacity: 1;
    }

    .overlay-icon {
        color: white;
        font-size: 2rem;
        background: rgba(45, 106, 79, 0.8);
        padding: 15px;
        border-radius: 50%;
    }

    /* Lightbox */
    .lightbox {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        z-index: 2000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .lightbox.active {
        display: flex;
        animation: fadeIn 0.3s;
    }

    .lightbox-img {
        max-width: 90%;
        max-height: 90vh;
        border-radius: 8px;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }

    .lightbox-close {
        position: absolute;
        top: 30px;
        right: 30px;
        color: white;
        font-size: 2rem;
        cursor: pointer;
        background: none;
        border: none;
        transition: transform 0.2s;
    }

    .lightbox-close:hover {
        transform: rotate(90deg);
        color: var(--agro-accent);
    }
</style>

<header class="hero-wrapper text-center"
    style="background-image: url('{% static 'images/gallery_banner.png' %}'); height: 50vh; min-height: 350px;">
    <div class="hero-overlay"></div>
    <div class="container hero-content-inner">
        <h1 class="display-3 fw-bold mb-3 text-white">Visual Story</h1>
        <p class="lead fs-4 text-white opacity-90">Glimpses of daily life at the farm</p>
    </div>
</header>

<section class="section-padding">
    <div class="container">

        <!-- Filters -->
        <div class="text-center">
            <div class="gallery-filter">
                <button class="filter-btn active" onclick="filterGallery('all', this)">All</button>
                <button class="filter-btn" onclick="filterGallery('farm', this)">Farm Life</button>
                <button class="filter-btn" onclick="filterGallery('cow-products', this)">Cow Products</button>
                <button class="filter-btn" onclick="filterGallery('agriculture', this)">Agriculture</button>
            </div>
        </div>

        <div class="masonry-grid" id="galleryGrid">
            {% for g in gallery_images %}
            <div class="masonry-item gallery-item animate__animated animate__fadeIn" data-category="{{ g.category }}">
                <div class="gallery-card" onclick="openLightbox('{{ g.image.url }}')">
                    <img src="{{ g.image.url }}" alt="{{ g.title|default:'Gallery Image' }}">
                    <div class="gallery-overlay">
                        <i class="bi bi-zoom-in overlay-icon"></i>
                    </div>
                </div>
            </div>
            {% empty %}
            <!-- Demo Content if no backend images -->
            <div class="masonry-item gallery-item" data-category="farm">
                <div class="gallery-card" onclick="openLightbox('{% static 'images/brown-cow-eatting-grass_.jpg' %}')">
                    <img src="{% static 'images/brown-cow-eatting-grass_.jpg' %}" alt="Cow">
                    <div class="gallery-overlay"><i class="bi bi-zoom-in overlay-icon"></i></div>
                </div>
            </div>
            <div class="masonry-item gallery-item" data-category="agriculture">
                <div class="gallery-card" onclick="openLightbox('{% static 'images/CowDungManure.jpeg' %}')">
                    <img src="{% static 'images/CowDungManure.jpeg' %}" alt="Field">
                    <div class="gallery-overlay"><i class="bi bi-zoom-in overlay-icon"></i></div>
                </div>
            </div>
            <div class="masonry-item gallery-item" data-category="cow-products">
                <div class="gallery-card" onclick="openLightbox('{% static 'images/OrganicCup.jpeg' %}')">
                    <img src="{% static 'images/OrganicCup.jpeg' %}" alt="Ghee">
                    <div class="gallery-overlay"><i class="bi bi-zoom-in overlay-icon"></i></div>
                </div>
            </div>
            <div class="masonry-item gallery-item" data-category="farm">
                <div class="gallery-card" onclick="openLightbox('{% static 'images/farm_gallery.jpeg' %}')">
                    <img src="{% static 'images/farm_gallery.jpeg' %}" alt="Farm House">
                    <div class="gallery-overlay"><i class="bi bi-zoom-in overlay-icon"></i></div>
                </div>
            </div>
            <div class="masonry-item gallery-item" data-category="agriculture">
                <div class="gallery-card" onclick="openLightbox('{% static 'images/CowDungAsh.jpeg' %}')">
                    <img src="{% static 'images/CowDungAsh.jpeg' %}" alt="Harvest">
                    <div class="gallery-overlay"><i class="bi bi-zoom-in overlay-icon"></i></div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>

<!-- Lightbox Modal -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <button class="lightbox-close" onclick="closeLightbox(event)">&times;</button>
    <img src="" alt="Full view" class="lightbox-img" id="lightboxImg">
</div>

<script>
    function filterGallery(category, btn) {
        // Active Class logic
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Filter Logic
        const items = document.querySelectorAll('.gallery-item');
        items.forEach(item => {
            const itemCat = item.getAttribute('data-category');
            if (category === 'all' || itemCat === category) {
                item.style.display = 'block';
                item.classList.add('animate__animated', 'animate__fadeIn');
            } else {
                item.style.display = 'none';
            }
        });
    }

    function openLightbox(src) {
        const lightbox = document.getElementById('lightbox');
        const img = document.getElementById('lightboxImg');
        img.src = src;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden'; // Prevent scrolling
    }

    function closeLightbox(e) {
        if (e.target !== document.getElementById('lightboxImg')) {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = 'auto'; // Restore scrolling
        }
    }
</script>
{% endblock %}
